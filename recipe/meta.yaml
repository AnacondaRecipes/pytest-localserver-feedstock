{% set name = "pytest-localserver" %}
{% set version = "0.9.0.post0" %}
{% set hash = "8033a36fb382d2bc4850f9acfe2c3fb5654cd5f0d163af6daf47f290db7d5ff0" %}
{% set ext = "tar.gz" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ ext }}
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pytest_localserver-{{ version }}.tar.gz
  sha256: {{ hash }}

build:
  noarch: python
  number: 0
  script: python setup.py install --single-version-externally-managed --record=record.txt
  skip: true  # [py<36]

requirements:
  build:
    - python
    - setuptools
  run:
    - python
    - pytest
    - werkzeug >=0.10
  host:
    - python
    - setuptools >=42
    - setuptools-scm >=3.4.1
    - pip

test:
  requires:
    - pytest
  imports:
    - pytest_localserver
  commands:
    - py.test --help

about:
  home: https://bitbucket.org/pytest-dev/pytest-localserver
  license: MIT
  summary: pytest-localserver is a plugin for the pytest testing framework which enables you to test server connections locally.

extra:
  recipe-maintainers:
    - nicoddemus